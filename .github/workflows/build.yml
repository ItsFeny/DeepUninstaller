name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar
        run: dotnet publish DeepUninstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DeepUninstaller-win-x64
          path: publish/DeepUninstaller.exe

      - name: Crear release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DeepUninstaller.exe
          generate_release_notes: true
